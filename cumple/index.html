<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Una sorpresa para Franklin 💙</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="inicio">
    <div id="confetti-container"></div>

    <main class="pantalla-inicio">
      <div class="contenido-inicio">
        <div class="decoracion">🎈 ✨ 🎉</div>

        <span class="etiqueta">UN DÍA ESPECIAL</span>

        <h1>¡Feliz cumpleaños!</h1>

        <h2>Franklin 💙</h2>

        <p>
          Hoy es un día para celebrar a alguien muy especial. Preparé una
          pequeña sorpresa para ti.
        </p>

        <div class="sobre" id="sobre">
          <div class="sobre-carta">💌</div>
          <div class="sobre-tapa"></div>
        </div>

        <a href="carta.html" class="btn-principal" onclick="prepararSalida()">
          Abrir mi cartita 💙
        </a>

        <span class="nota">Hay algo que quiero decirte...</span>
      </div>

      <div class="burbuja burbuja1"></div>
      <div class="burbuja burbuja2"></div>
      <div class="burbuja burbuja3"></div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
